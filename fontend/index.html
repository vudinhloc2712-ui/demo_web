<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Weather Information Management</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="container">

        <h1>Weather Information Management</h1>

        <!-- ================= FORM ================= -->

        <div class="form-container">

            <h2>Weather Information</h2>

            <div class="form-grid">

                <div class="form-group">
                    <label for="city">City</label>
                    <input
                        type="text"
                        id="city"
                        placeholder="Enter city"
                    >
                </div>

                <div class="form-group">
                    <label for="date">Date</label>
                    <input
                        type="date"
                        id="date"
                    >
                </div>

                <div class="form-group">
                    <label for="temperature">Temperature (°C)</label>
                    <input
                        type="number"
                        id="temperature"
                        placeholder="25"
                    >
                </div>

                <div class="form-group">
                    <label for="humidity">Humidity (%)</label>
                    <input
                        type="number"
                        id="humidity"
                        placeholder="80"
                    >
                </div>

                <div class="form-group">
                    <label for="wind">Wind Speed (km/h)</label>
                    <input
                        type="number"
                        id="wind"
                        placeholder="12"
                    >
                </div>

                <div class="form-group">
                    <label for="weather">Weather</label>

                    <select id="weather">

                        <option value="Sunny">
                            Sunny
                        </option>

                        <option value="Cloudy">
                            Cloudy
                        </option>

                        <option value="Rainy">
                            Rainy
                        </option>

                        <option value="Stormy">
                            Stormy
                        </option>

                        <option value="Snowy">
                            Snowy
                        </option>

                    </select>
                </div>

            </div>


            <!-- BUTTONS -->

            <div class="form-buttons">

                <button
                    class="btn-add"
                    onclick="addWeather()"
                >
                    Add
                </button>

                <button
                    class="btn-update"
                    onclick="updateWeather()"
                >
                    Update
                </button>

                <button
                    class="btn-delete"
                    onclick="deleteWeather()"
                >
                    Delete
                </button>

                <button
                    class="btn-clear"
                    onclick="clearForm()"
                >
                    Clear
                </button>

            </div>

        </div>


        <!-- ================= TABLE ================= -->

        <div class="table-container">

            <h2>Weather Information List</h2>

            <table>

                <thead>

                    <tr>
                        <th>City</th>
                        <th>Date</th>
                        <th>Temperature</th>
                        <th>Humidity</th>
                        <th>Wind Speed</th>
                        <th>Weather</th>
                    </tr>

                </thead>

                <tbody id="weatherTable">

                </tbody>

            </table>

        </div>


        <!-- ================= XML / JSON ================= -->

        <div class="data-container">

            <h2>XML & JSON</h2>

            <div class="data-buttons">

                <button
                    onclick="showJSON()"
                >
                    Show JSON
                </button>

                <button
                    onclick="showXML()"
                >
                    Show XML
                </button>



            </div>


            <h3>Data Preview</h3>

            <pre id="preview">
Select an operation above.
            </pre>

        </div>

    </div>


    <!-- JavaScript -->

    <script src="script.js"></script>

</body>

</html>
